name: Release

# CD: pushing a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`)
# re-runs the full CI pipeline, then publishes a GitHub Release containing
# HTML renders of every notebook plus the source code.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml # reuse the exact same quality gates

  release:
    name: Build & publish release
    needs: ci # only release if CI is green
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so release notes can list commits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Render notebooks to HTML (stored outputs, no re-execution)
        run: |
          mkdir -p dist/notebooks
          git ls-files -z '*.ipynb' | xargs -0 -I{} \
            jupyter nbconvert --to html --output-dir dist/notebooks "{}"
          (cd dist && zip -qr "notebooks-html-${GITHUB_REF_NAME}.zip" notebooks)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/notebooks-html-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
