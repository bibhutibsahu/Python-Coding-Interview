[project]
name = "python-coding-interview"
version = "0.1.0"
description = "Python, pandas and SQL interview practice notebooks and scripts."
readme = "README.md"
requires-python = ">=3.9"

# ---------------------------------------------------------------- ruff (lint + format)
[tool.ruff]
line-length = 100
target-version = "py39"
# Practice notebooks are scratchpads (intentional errors, Colab-only paths).
# They are covered by notebook validation + execution of the curated list instead.
extend-exclude = ["*.ipynb", ".venv"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes (unused imports, undefined names)
  "W",   # pycodestyle warnings
  "I",   # isort (import ordering)
  "B",   # flake8-bugbear (likely bugs)
  "UP",  # pyupgrade (modern syntax)
  "SIM", # flake8-simplify
]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
