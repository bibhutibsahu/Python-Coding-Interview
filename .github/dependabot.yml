# Opens weekly PRs to keep dependencies and GitHub Actions up to date.
# Each PR runs through CI, so a bump that breaks something is caught before merge.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
